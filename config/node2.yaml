node_id: node2
log_level: info

server:
  bind: "0.0.0.0"
  client_port: 2389
  raft_port: 2381
  io_threads: 4

storage:
  data_dir: /var/lib/orcdb/node2
  sync_writes: true

raft:
  election_timeout_min_ms: 150
  election_timeout_max_ms: 300
  heartbeat_interval_ms: 50
  rpc_timeout_ms: 50

auth:
  algorithm: HS256
  secret: "CHANGE_ME_IN_PRODUCTION"
  issuer: orcdb

peers:
  - id: node1
    host: 127.0.0.1
    raft_port: 2380
  - id: node3
    host: 127.0.0.1
    raft_port: 2382
